# Hack Lab configuration. Copy to config.toml (untracked) and edit.
# The Anthropic API key is NEVER put in this file: set ANTHROPIC_API_KEY in
# the environment (systemd EnvironmentFile on the Pi, .env locally).

[app]
host = "0.0.0.0"
port = 8000
# Where sketch versions, logs and state live. Must be writable.
data_dir = "data"
# Use the emulated board instead of a real USB Nano (dev / CI).
fake_board = false
# Extra hostnames the app may be reached by (hacklab.local, hacklab, localhost, IP literals and
# *.ts.net are always allowed). Other Host values get 400: see README "Safety for a young user".
# allowed_hosts = ["robots.lan"]

[ai]
model = "claude-sonnet-5-5"
# The AI spend budget is set once, in the Claude Console (workspace spend limit); no cap here.
