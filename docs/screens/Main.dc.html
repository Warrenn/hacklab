<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hack Lab — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:#1B1F3A}
a{color:#1B1F3A}a:hover{color:#FF6B1A}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; font-family: Nunito, system-ui, sans-serif; color: #1B1F3A">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 2px solid #EEF0F5">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg>
      </div>
      <div style="font-size: 26px; font-weight: 900">Hack Lab</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="BoxPicker.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: #F3F4F8; font-weight: 800; font-size: 17px; text-decoration: none">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #0FA3A3; display: inline-block"></span>
        IR Turret · plugged in
      </a>
      <span style="padding: 10px 16px; border-radius: 999px; background: #E6F7F7; color: #0B7A7A; font-weight: 800; font-size: 17px">AI helper is here</span>
    </div>
  </header>

  <main style="flex: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; padding: 28px 32px; min-height: 0">

    <section style="grid-column: span 7; display: flex; flex-direction: column; gap: 20px; min-width: 0">
      <h1 style="margin: 0; font-size: 40px; font-weight: 900; line-height: 1.1">What should the turret do?</h1>
      <label for="ask" style="font-size: 18px; font-weight: 800; color: #5B6078">Say it or type it. Tap the mic on your keyboard to talk.</label>
      <div style="display: flex; gap: 12px; align-items: stretch">
        <input id="ask" type="text" placeholder="Make it shake its head when I press 7" style="flex: 1; font: inherit; font-size: 24px; font-weight: 600; padding: 20px 22px; border: 3px solid #D9DCE6; border-radius: 18px; min-width: 0">
        <button type="button" style="font: inherit; font-size: 22px; font-weight: 900; color: #fff; background: {{accent}}; border: 0; border-radius: 18px; padding: 0 30px; cursor: pointer">Go!</button>
      </div>

      <div style="margin-top: 8px; font-size: 18px; font-weight: 800; color: #5B6078">Try one of these</div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{tries}}" as="t" hint-placeholder-count="3">
          <button type="button" onClick="{{t.pick}}" style="display: flex; align-items: center; justify-content: space-between; text-align: left; font: inherit; font-size: 21px; font-weight: 800; padding: 18px 22px; border-radius: 16px; border: 2px solid #E3E6EE; background: #FAFBFD; cursor: pointer">
            <span>{{t.text}}</span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </button>
        </sc-for>
      </div>
    </section>

    <aside style="grid-column: span 5; display: flex; flex-direction: column; gap: 16px; min-width: 0">
      <div style="background: #F7F8FB; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
        <div style="font-size: 16px; font-weight: 800; color: #5B6078; text-transform: uppercase; letter-spacing: 0.06em">Right now the turret</div>
        <div style="font-size: 24px; font-weight: 900">Shakes its head on 7</div>
        <div style="font-size: 17px; font-weight: 600; color: #5B6078">Change 3 of 3 · 2 minutes ago</div>
        <a href="Done.dc.html" style="font-size: 17px; font-weight: 800; color: {{accent}}">Show me the code</a>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px">
        <button type="button" style="display: flex; align-items: center; gap: 14px; font: inherit; font-size: 22px; font-weight: 900; padding: 20px 22px; border-radius: 18px; border: 3px solid #1B1F3A; background: #fff; cursor: pointer">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-2"></path></svg>
          Undo last change
        </button>
        <button type="button" style="display: flex; align-items: center; gap: 14px; font: inherit; font-size: 22px; font-weight: 900; padding: 20px 22px; border-radius: 18px; border: 3px solid #0FA3A3; color: #0B7A7A; background: #fff; cursor: pointer">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
          Back to how it came
        </button>
      </div>

      <div style="margin-top: auto; font-size: 15px; font-weight: 600; color: #8A90A8">Nothing you try can break it. Those two buttons always put it right.</div>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B1A","options":["#FF6B1A","#5B5BFF","#0FA3A3","#E0338C"]},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const tries = [
      'Make it look left, then right, then fire',
      'Make it nod yes when I press 1',
      'Make it spin slowly like a lighthouse'
    ].map((text, i) => ({ text, pick: () => this.setState({ picked: i }) }));
    return { accent: this.props.accent ?? '#FF6B1A', tries };
  }
}
</script>
</body>
</html>
