<style>
/* Visual spec: docs/screens/*.dc.html. System fonts: the kid's iPad is offline-first and the repo allows no external links. */
:root{--ink:#1B1F3A;--muted:#5B6078;--faint:#8A90A8;--line:#E3E6EE;--rule:#EEF0F5;--panel:#F7F8FB;--chip:#F3F4F8;--card:#FAFBFD;--accent:#FF6B1A;--accent-dark:#C44E0B;--accent-soft:#FFE8DA;--peach:#FFF4EC;--teal:#0FA3A3;--teal-dark:#0B7A7A;--teal-soft:#E6F7F7;--amber:#FFF1D6;--amber-dark:#8A5A00;--amber-bg:#FFF8E8;--amber-line:#F5D98B;--code:#1B1F3A;--code-ink:#E8EAF2}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink)}
#app{min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 32px;border-bottom:2px solid var(--rule);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:900}
button.brand{background:none;border:0;padding:0;text-align:left}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:0}
.chips{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:var(--chip);font-weight:800;font-size:17px;border:0;text-decoration:none}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--teal);display:inline-block}
.chip.off .dot{background:var(--faint)}
.chip.ai{background:var(--teal-soft);color:var(--teal-dark)}
.chip.away{background:var(--amber);color:var(--amber-dark)}
.boxbtn{display:inline-flex;align-items:center;gap:10px;padding:6px 12px 6px 8px;border-radius:999px;border:2px solid var(--teal);background:var(--teal-soft);color:var(--teal-dark);font-weight:800;font-size:17px}
.boxbtn.off{border-color:var(--amber-dark);background:var(--amber);color:var(--amber-dark)}
.boxbtn .thumb{width:46px;height:28px;object-fit:contain;border-radius:8px;background:#fff}
.boxbtn svg{width:18px;height:18px}
main{flex:1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;padding:28px 32px;min-height:0}
.col7{grid-column:span 7;display:flex;flex-direction:column;gap:20px;min-width:0}
.col6{grid-column:span 6;display:flex;flex-direction:column;gap:22px;min-width:0}
.col5{grid-column:span 5;display:flex;flex-direction:column;gap:16px;min-width:0}
.col4{grid-column:span 4;display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
.col8{grid-column:span 8;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
/* The code page is viewport-high: the code panel fills it and scrolls inside (owner, 2026-10-31). */
.col12{grid-column:span 12;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.toprow .donehead{flex:1 1 420px;min-width:0}
.toprow .actions{margin-top:0;flex:0 0 auto}
.toprow .primary.wide{flex:0 0 auto}
.curious{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.curious .prompt{flex:0 0 auto}
.curious .sub{margin-right:10px}
.curious .prompt{padding:10px 14px;font-size:17px}
#app.fill{height:100%;overflow:hidden}
#app.fill main{padding-top:18px;padding-bottom:18px}
#app.fill .col12{gap:10px}
#app.fill pre{max-height:none}
h1{margin:0;font-size:40px;font-weight:900;line-height:1.1}
.lead{font-size:18px;font-weight:800;color:var(--muted)}
.sub{margin:0;font-size:20px;font-weight:700;color:var(--muted);line-height:1.4}
.ask{display:flex;gap:12px;align-items:flex-end}
.ask textarea{flex:1;font:inherit;font-size:24px;font-weight:600;line-height:1.3;padding:16px 22px;border:3px solid #D9DCE6;border-radius:18px;min-width:0;resize:none;min-height:72px;max-height:40vh;overflow:auto}
.primary{font-size:22px;font-weight:900;color:#fff;background:var(--accent);border:0;border-radius:18px;padding:18px 30px;text-align:center;text-decoration:none}

.panel{background:var(--panel);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:16px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.big{font-size:24px;font-weight:900}

.link,.codefoot button{font:inherit;font-size:16px;font-weight:800;padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);align-self:flex-start}

.photo{display:flex;align-items:center;justify-content:center;background:transparent;overflow:visible;min-height:0}
.photo img{display:block;width:100%;max-width:400px;height:auto;aspect-ratio:400/230;object-fit:contain}
.boxname{display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;font-weight:900}
.tick{width:34px;height:34px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:32px;text-align:center}
.quote{font-size:34px;font-weight:900;max-width:820px;line-height:1.2}
.stages{list-style:none;margin:12px 0 0;padding:0;display:flex;align-items:flex-start;justify-content:center;flex-wrap:wrap;gap:0}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;width:200px;font-size:19px;font-weight:800;color:var(--faint)}
.stage .ball{width:64px;height:64px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center}
.stage.done{color:var(--teal-dark)}.stage.done .ball{background:var(--teal)}
.stage.now{color:var(--ink);font-weight:900}.stage.now .ball{background:var(--accent);box-shadow:0 0 0 10px var(--accent-soft);animation:pulse 1.2s ease-in-out infinite}
.bar{width:70px;height:6px;background:var(--line);border-radius:3px;margin-top:29px}
.bar.done{background:var(--teal)}
@keyframes pulse{50%{box-shadow:0 0 0 16px var(--accent-soft)}}
.explain{background:var(--panel);border-radius:18px;padding:18px 26px;font-size:19px;font-weight:700;color:var(--muted);max-width:760px}
.explain.warm{background:var(--peach);color:var(--ink);line-height:1.45}
.faint{font-size:16px;font-weight:700;color:var(--faint)}
.donehead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donehead .sub{white-space:nowrap}
.donehead .tick{width:60px;height:60px}
.donehead h1{font-size:30px;line-height:1.2}
.prompt{display:flex;align-items:center;gap:14px;text-align:left;font-size:19px;font-weight:800;padding:16px 20px;border-radius:16px;border:2px solid var(--line);background:var(--card)}
.q{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;font-weight:900}
.actions{margin-top:auto;display:flex;gap:12px;flex-wrap:wrap}
pre{margin:0;flex:1;overflow:auto;background:var(--code);color:var(--code-ink);border-radius:18px;padding:20px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.55;min-height:120px;max-height:60vh}
pre .hl{background:#3A3F63;border-radius:4px;padding:0 4px}
pre .set{background:var(--accent);color:#fff;border-radius:6px;padding:1px 8px;font-weight:700}
pre .cm{color:#8A90A8}
.pill{font-size:16px;font-weight:800;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#fff}
.codefoot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;font-weight:700;color:var(--faint);flex-wrap:wrap}
.codefoot .try-it{border-color:var(--accent);color:var(--accent);margin-left:8px}
.banner{margin:20px 32px 0;background:var(--amber-bg);border:2px solid var(--amber-line);border-radius:18px;padding:16px 22px;display:flex;align-items:center;gap:16px;font-size:18px;font-weight:700;color:#5B4A1E;line-height:1.35}
.tricks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.trick{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px 20px;border-radius:16px;border:2px solid var(--line);background:var(--card)}
.trick b{font-size:21px;font-weight:900}
.trick span{font-size:16px;font-weight:700;color:var(--muted)}
.trick.numbers{border:2px dashed var(--accent);background:var(--peach)}
.trick.numbers b{color:var(--accent-dark)}
.slider{display:flex;flex-direction:column;gap:10px}
.slider label{display:flex;justify-content:space-between;font-size:22px;font-weight:900}
.slider label output{color:var(--accent)}
.slider .hint{font-size:15px;font-weight:600;color:var(--muted);margin:-4px 0 6px}
.slider input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
.slider select{font:inherit;font-size:20px;font-weight:800;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:#fff}
.summary{background:var(--panel);border-radius:16px;padding:14px 18px;font-size:16px;font-weight:700;color:var(--muted);line-height:1.4}
.back{width:44px;height:44px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;border:0;flex-shrink:0}
textarea.editor{flex:1;min-height:360px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5;padding:16px;border-radius:18px;border:3px solid #D9DCE6;resize:vertical}
footer{padding:16px 32px 24px;display:flex;justify-content:center}
.sr{position:absolute;left:-9999px}
@media (max-width:860px){
  header,main{padding-left:16px;padding-right:16px}
  main{grid-template-columns:1fr;gap:20px;padding-top:20px}
  .col7,.col6,.col5,.col4,.col8,.col12{grid-column:auto}
  #app.fill{height:auto;overflow:visible}
  #app.fill pre{max-height:40vh}
  h1{font-size:30px}
  .brand{font-size:22px}
  .boxbtn .thumb{display:none}
  .ask{flex-direction:column}
  .grid3{grid-template-columns:1fr}
  .photo,.photo img{min-height:160px;height:160px}
  .tricks{grid-template-columns:1fr}
  .stage{width:46%}
  .bar{display:none}
  .banner{margin:16px 16px 0}
  .quote{font-size:26px}
  pre{max-height:40vh}
}

<body>
<div id="app" aria-live="polite"></div>
<script src="/static/vendor/editor.js"></script>
<script>
'use strict';
// One screen router keyed on state. All kid-facing copy either comes from the
// server (message_kid, titles, prompts) or is copied verbatim from docs/screens.
const S = { status: null, boxes: [], behaviours: [], sketch: null, job: null, asked: '', screen: 'picker',
            picked: null, tweak: null, concept: null, showCode: true, editor: '', busy: false, chat: [],
            explanation: null, sel: null, back: 'home', draft: '', ready: null, thinking: false, numbers: null };
const $app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (path, body) => {
  const r = await fetch('/api' + path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) {
    let detail = '';
    try { detail = (await r.json()).detail || ''; } catch (_) { /* no body */ }
    throw Object.assign(new Error('api ' + r.status), { status: r.status, detail });
  }
  return r.json();
};
// Remote view (owner's P5 notes): a Tailscale viewer may only change things while helping is on.
const remote = () => S.status?.source === 'remote';
const helping = () => !!S.status?.helping;
const locked = () => remote() && !helping();
const dis = (extra = false) => (locked() || extra ? 'disabled' : '');
const boxName = () => (S.boxes.find((b) => b.id === S.status?.box) || {}).name || 'box';
const changes = () => Math.max(0, (S.status?.versions_count || 1) - 1);
// "Try it" / "Change the numbers" follow the trick the kid just flashed, else the first one with numbers.
// Level 2 on the box's own code (P8 round 4): the IDE's markers in every file of the current
// version are sliders too. A just-flashed trick with sliders still wins; else the box's own numbers.
const numbersItem = () => {
  const files = (S.numbers || []).filter((f) => f.tweakables && f.tweakables.length);
  if (!files.length) return null;
  return { id: 'numbers', numbers: true, files, title: `The ${boxName()}'s numbers`,
    description: 'These are the numbers CrunchLabs left for you to change. Slide, then send.',
    tweakables: files.flatMap((f) => f.tweakables.map((t) => ({ ...t, file: f.name }))) };
};
const tweakable = () => S.behaviours.find((b) => b.id === S.lastBehaviour && b.tweakables?.length) || numbersItem();

// ---------- icons (inline, no external assets) ----------
const I = {
  logo: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',
  tick: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>`,
  arrow: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  undo: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-2"/></svg>',
  reset: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
  bolt: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l-6 9h5l-1 7 6-9h-5z"/></svg>',
  wifi: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a8 8 0 0 1 14 0"/><path d="M8.5 15.5a4 4 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/><path d="M3 3l18 18"/></svg>',
  back: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B1F3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
};

// ---------- pieces ----------
function header(opts = {}) {
  const st = S.status || {};
  const plugged = st.board_connected ? 'plugged in' : 'not plugged in';

// "2 minutes ago" for the Home card; kid words, no clock arithmetic on screen.
function ago(epochS) {
  if (!epochS) return '';
  const s = Math.max(0, Math.floor(Date.now() / 1000 - epochS));
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60) return `${m} minute${m === 1 ? '' : 's'} ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} hour${h === 1 ? '' : 's'} ago`;
  const d = Math.floor(h / 24);
  return d === 1 ? 'yesterday' : `${d} days ago`;
}

function highlight(src, values) {
  // Numbers carrying a ///{...} Level 2 marker get the highlight; values the
  // kid set in Tweak are shown in the accent colour. Other lines get syntax
  // colours from the vendored editor bundle when it is loaded.
  const coloured = window.HLEditor ? HLEditor.highlightLines(src) : null;
  const lines = src.split('\n').map((line, i) => {
    let out = coloured ? coloured[i] : esc(line);
    if (/\/\/\/\{/.test(line)) {
      out = esc(line);
      const code = line.split('///')[0];
      const m = code.match(/(\w+)\s*=\s*(-?[\d.]+f?|true|false)|#define\s+(\w+)\s+(-?[\d.]+f?)|\((\d+)\)/);
      if (m) {
        const name = m[1] || m[3], val = m[2] ?? m[4] ?? m[5];
        const set = values && name && values[name] !== undefined ? values[name] : null;
        out = out.replace(esc(val), set !== null ? `<span class="set">${esc(set)}</span>` : `<span class="hl">${esc(val)}</span>`);
      }
      out = out.replace(/\/\/\/.*$/, (s) => `<span class="cm">${s}</span>`);
    }
    return out;
  });
  const [a, b] = S.sel ? [Math.min(S.sel.a, S.sel.b ?? S.sel.a), Math.max(S.sel.a, S.sel.b ?? S.sel.a)] : [0, -1];
  return lines.map((l, i) => `<span class="ln ${i + 1 >= a && i + 1 <= b ? 'sel' : ''}" data-ln="${i + 1}">${l}</span>`).join('');
}

    : `<textarea class="editor" id="editor" spellcheck="false">${esc(S.editor)}</textarea>`;
  return `${header({ back: 'done', title: 'Level 3: edit all the code', chips: false })}<main style="display:flex;flex-direction:column;gap:16px">
    <p class="sub">Change anything you like, then send it. If it does not build, you get it back to fix. Undo always works.</p>
    ${field}
    <div class="actions"><button class="primary wide" data-act="sendsketch">Send to ${name}</button><button class="ghost" data-act="done">Back</button></div></main>`;
}
// Completion words for Level 3: the box's helper function names, keys, pins and the sketch's own identifiers.
function editorWords() {
  const box = S.boxes.find((b) => b.id === S.status?.box) || {};
  const helpers = (box.helpers || []).map((h) => (h.match(/^([A-Za-z_]\w*)\s*\(/) || [])[1]).filter(Boolean);
  return [...helpers, ...(box.keys || [])];
}
let cm = null;
function mountEditor() {
  const el = document.getElementById('editor-mount');
  if (!el || !window.HLEditor) return;
  cm = HLEditor.mount(el, S.editor, { words: editorWords(), onChange: (t) => { S.editor = t; } });
}
function editorText() {
  return cm ? cm.get() : (document.getElementById('editor')?.value ?? S.editor);
}

// ---------- state + actions ----------
const SCREENS = { picker, home, offline, working, failed, done, tweak, editor, how: howItWorks };
function render() {
  if (cm) { cm.destroy(); cm = null; }
  const hadFocus = document.activeElement?.id === 'ask';
  const oldPre = document.querySelector('pre');
  const scroll = oldPre ? [oldPre.scrollTop, oldPre.scrollLeft] : null;
  $app.classList.toggle('fill', S.screen === 'done' && !S.explanation);
  $app.innerHTML = SCREENS[S.screen]();
  // The code panel keeps its place across rebuilds (a tapped line, a status event, the refresh).
  const newPre = document.querySelector('pre');
  if (newPre && scroll) { newPre.scrollTop = scroll[0]; newPre.scrollLeft = scroll[1]; }
  if (S.screen === 'editor') mountEditor();
  const a = document.getElementById('ask');
  if (!a) return;
  // The screen is rebuilt on every status event and the 20 s refresh: the draft lives in S.
  a.value = S.draft;
  grow(a);
  if (hadFocus || window.innerWidth > 860) { a.focus(); a.setSelectionRange(a.value.length, a.value.length); }
}
function homeScreen() { return S.status?.ai_available ? 'home' : 'offline'; }
async function refresh() {
  const was = S.status?.box;
  S.status = await api('/status');
  if (was !== undefined && S.status.box !== was) {
    // A different box, however it was picked (here, by a remote helper, after a restart): the
    // discussion, the held plan and the half-typed request belonged to the old one.
    S.chat = []; S.ready = null; S.draft = '';
  }
  if (!S.boxes.length) S.boxes = await api('/boxes').catch(() => []);
  if (S.status.box) {
    [S.behaviours, S.sketch, S.numbers] = await Promise.all([api('/behaviours').catch(() => []), api('/sketch/current').catch(() => null), api('/tweakables').then((r) => r.files).catch(() => null)]);
  }
}
async function startJob(kind, path, body, asked) {
  S.asked = asked;
  S.concept = null;
  try {
    const { job_id } = await api(path, body);
    S.job = { job_id, kind, state: 'queued', message_kid: 'Getting ready.' };
    // An ask is a conversation: the kid stays on Home and watches the helper think. Everything
    // that changes the box (Go!, tricks, Undo) walks the Working screen.
    if (path === '/ask') S.thinking = true; else S.screen = 'working';
    render();
    // The first stage events can beat this response on the SSE stream; sync once.
    api('/jobs/' + job_id).then(onJob).catch(() => {});
    pollJob(job_id);
  } catch (e) {
    if (path === '/ask' && e.status === 409 && e.detail) {
      // the helper is busy with another idea (or away): its words become a bubble, the kid's text stays
      S.thinking = false; S.chat = [...S.chat, { role: 'helper', text: e.detail }]; render(); return;
    }
    if (e.status === 409) { await refresh(); S.screen = S.status.box ? homeScreen() : 'picker'; render(); }
    else { S.job = { kind, state: 'failed', message_kid: 'That one did not work. Try again, or press Undo.' }; S.screen = 'failed'; render(); }
  }
}
function onJob(job) {
  if (!S.job || job.job_id !== S.job.job_id) return;
  // A late reply to the post-submit sync or a poll must never overwrite a finished job
  // (seen on Firefox: the Done heading showed the compiling stage text).
  if (S.job.state === 'done' || S.job.state === 'failed') return;
  S.job = { ...S.job, ...job };
  if (job.state === 'done' || job.state === 'failed') finishJob();
  else if (S.screen === 'working' || S.thinking) render();
}
let finishing = false;
async function finishJob() {
  if (finishing) return;
  finishing = true;
  try {
    await refresh();
    if (S.thinking) {
      // The helper answered (ready: Go! wakes up; a question or explanation: keep talking;
      // away/declined: its words, in kid language). Still on Home either way.
      S.thinking = false;
      S.chat = [...S.chat, { role: 'helper', text: S.job.message_kid }];
      S.ready = S.job.state === 'done' && S.job.answer === 'ready' ? S.job.job_id : null;
      S.screen = homeScreen();
    } else if (S.job.state === 'failed') S.screen = 'failed';
    else if (S.job.kind === 'explain') { S.explanation = S.job.explanation; S.sel = null; S.job = S.prevJob || null; S.screen = 'done'; }
    else {
      if (S.job.kind === 'ask') { S.chat = []; S.ready = null; }
      S.screen = S.job.kind === 'undo' || S.job.kind === 'reset' ? homeScreen() : 'done';
    }
    render();
  } finally { finishing = false; }
}
function pollJob(id) {
  // SSE is primary; this poll is the fallback for a dropped stream.
  const t = setInterval(async () => {
    if (!S.job || S.job.job_id !== id || !(S.screen === 'working' || S.thinking)) return clearInterval(t);
    try { onJob(await api('/jobs/' + id)); } catch (_) { /* keep waiting */ }
  }, 1500);
}
function connectEvents() {
  const es = new EventSource('/api/events');
  es.onmessage = (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch (_) { return; /* ping */ }
    if (d.type === 'status') { refresh().then(render); return; }
    onJob(d);
  };
  es.onerror = () => { es.close(); setTimeout(connectEvents, 3000); };
}
function openTweak(id) {
  const b = id === 'numbers' ? numbersItem() : S.behaviours.find((x) => x.id === id);
  if (!b) return;
  S.tweak = { behaviour: b, values: Object.fromEntries(b.tweakables.map((tw) => [tw.name, tw.value])) };
  S.screen = 'tweak';
  render();
}
const ACTIONS = {
  picker: () => { S.picked = S.status?.box || S.picked; S.screen = 'picker'; render(); },
  pick: async (id) => {
    // Tapping a card is the whole move: pick the box and go Home (owner, 2026-10-31).
    S.picked = id; S.busy = true; render();
    try { await api('/box', { id }); await refresh(); S.screen = homeScreen(); }
    finally { S.busy = false; render(); }
  },
  helping: async () => { await api('/helping', { on: !helping() }); await refresh(); render(); },
  suggest: (text, el) => ask(text, el?.dataset.title || text),
  flash: () => startJob('ask', '/go', { job_id: S.ready }, S.chat.filter((t) => t.role === 'kid').pop()?.text || ''),
  startover: () => { S.chat = []; S.ready = null; S.draft = ''; render(); },
  home: () => { S.screen = homeScreen(); render(); },
  done: () => { S.screen = 'done'; render(); },
  code: () => { S.job = null; S.concept = null; S.explanation = null; S.sel = null; S.screen = 'done'; render(); },
  explaincode: () => { S.prevJob = S.job; startJob('explain', '/explain', { scope: 'sketch' }, 'What does this code do?'); },
  explainchanged: () => { S.prevJob = S.job; startJob('explain', '/explain', { scope: 'changed' }, 'What just changed?'); },
  explainlines: () => { const a = Math.min(S.sel.a, S.sel.b ?? S.sel.a), b = Math.max(S.sel.a, S.sel.b ?? S.sel.a); S.prevJob = S.job; startJob('explain', '/explain', { scope: 'lines', from: a, to: b }, `What do lines ${a} to ${b} do?`); },
  closeexplain: () => { S.explanation = null; render(); },
  stopjob: () => { if (S.job) api('/jobs/' + S.job.job_id + '/cancel', {}).catch(() => {}); },
  clearsel: () => { S.sel = null; render(); },
  how: () => { S.back = S.screen === 'done' ? 'done' : 'home'; S.screen = 'how'; render(); },
  behaviour: (id, el) => {
    S.lastBehaviour = id;
    const b = S.behaviours.find((x) => x.id === id);
    const label = el?.dataset.title || (b ? b.title : id);
    startJob('flash', '/flash/behaviour', { id, label }, label);
  },
  undo: () => startJob('undo', '/undo', {}, 'Undo last change'),
  reset: () => startJob('reset', '/reset', {}, 'Back to how it came'),
  tweak: (id) => openTweak(id),
  resetnumbers: () => openTweak(S.tweak.behaviour.id),
  send: () => {
    if (S.tweak.behaviour.numbers) { startJob('flash', '/flash/numbers', { values: S.tweak.values }, 'My numbers'); return; }
    const label = `${S.tweak.behaviour.title}, with my numbers`; startJob('flash', '/flash/behaviour', { id: S.tweak.behaviour.id, tweakables: S.tweak.values, label }, label);
  },
  editor: () => { S.editor = S.sketch?.source || ''; S.screen = 'editor'; render(); },
  sendsketch: () => startJob('flash', '/flash/sketch', { source: editorText() }, 'My own code'),
  concept: async (id) => { S.concept = await api('/concepts/' + id).catch(() => null); render(); },
};
// Picking lines (owner, 2026-10-31): the selection is kept as {a: low, b: high} (b null for one line).
// Nothing picked -> that line; one line -> a range in either order (the same line again clears);
// a range -> a tap outside expands it, a tap inside pulls the nearer end in (ties pull the top).
function pickLine(s, n) {
  if (!s) return { a: n, b: null };
  if (s.b == null) return n === s.a ? null : { a: Math.min(s.a, n), b: Math.max(s.a, n) };
  if (n < s.a) return { a: n, b: s.b };
  if (n > s.b) return { a: s.a, b: n };
  return n - s.a <= s.b - n ? { a: n, b: s.b } : { a: s.a, b: n };
}
$app.addEventListener('click', (e) => {
  const ln = e.target.closest('pre .ln');
  if (ln && S.screen === 'done') {
    const n = Number(ln.dataset.ln);
    S.sel = pickLine(S.sel, n);
    render();
    return;
  }
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled) ACTIONS[el.dataset.act](el.dataset.id, el);
});
function ask(text, shown = text) {
  // The kid's words go into the discussion at once; the helper's answer decides what happens next.
  const history = S.chat;
  S.chat = [...S.chat, { role: 'kid', text: shown }];
  S.draft = '';
  S.ready = null;
  startJob('ask', '/ask', { text, history }, text);
}
$app.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = S.draft.trim();
  if (text && !S.thinking) ask(text);
});
$app.addEventListener('input', (e) => {
  if (e.target.id === 'ask') {
    // No re-render per keystroke (iPad dictation and autocorrect compose in place): just the bits that depend on the draft.
    S.draft = e.target.value;
    grow(e.target);
    document.getElementById('tries')?.toggleAttribute('hidden', !!S.draft.trim());
    const go = $app.querySelector('[data-act="flash"]');
    if (go) go.disabled = !goReady();
    return;
  }
  const name = e.target.dataset.tw;
  if (!name || !S.tweak) return;
  const tw = S.tweak.behaviour.tweakables.find((x) => x.name === name);
  let v = e.target.value;
  if (!tw.options) { const [min, max] = tw.range || [tw.min, tw.max]; v = Math.min(max, Math.max(min, Number(v))); }
  S.tweak.values[name] = v;
  render();
});

(async function boot() {
  try { await refresh(); } catch (_) { S.status = { box: null, ai_available: false, board_connected: false }; }
  S.picked = S.status.box;
  S.screen = S.status.box ? homeScreen() : 'picker';
  // ?admin=1: a remote helper asks to help on arrival (the server refuses it from the LAN side)
  if (new URLSearchParams(location.search).get('admin') === '1' && remote() && !helping()) {
    try { await api('/helping', { on: true }); await refresh(); } catch (_) { /* not remote */ }
  }
  render();
  connectEvents();
  setInterval(async () => { if (S.screen === 'home' || S.screen === 'offline') { const was = S.status?.ai_available; await refresh().catch(() => {}); if (S.status?.ai_available !== was) S.screen = homeScreen(); render(); } }, 20000);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('/static/sw.js').catch(() => {});
})();
</script>
</body>
