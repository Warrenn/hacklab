<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FF6B1A">
<title>Hack Lab</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="icon" href="/static/icon.svg">
<style>
/* Visual spec: docs/screens/*.dc.html. System fonts: the kid's iPad is offline-first and the repo allows no external links. */
:root{--ink:#1B1F3A;--muted:#5B6078;--faint:#8A90A8;--line:#E3E6EE;--rule:#EEF0F5;--panel:#F7F8FB;--chip:#F3F4F8;--card:#FAFBFD;--accent:#FF6B1A;--accent-dark:#C44E0B;--accent-soft:#FFE8DA;--peach:#FFF4EC;--teal:#0FA3A3;--teal-dark:#0B7A7A;--teal-soft:#E6F7F7;--amber:#FFF1D6;--amber-dark:#8A5A00;--amber-bg:#FFF8E8;--amber-line:#F5D98B;--code:#1B1F3A;--code-ink:#E8EAF2}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink)}
#app{min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 32px;border-bottom:2px solid var(--rule);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:900}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:0}
.chips{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:var(--chip);font-weight:800;font-size:17px;border:0;text-decoration:none}
.chip .dot{width:12px;height:12px;border-radius:50%;background:var(--teal);display:inline-block}
.chip.off .dot{background:var(--faint)}
.chip.ai{background:var(--teal-soft);color:var(--teal-dark)}
.chip.away{background:var(--amber);color:var(--amber-dark)}
main{flex:1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;padding:28px 32px;min-height:0}
.col7{grid-column:span 7;display:flex;flex-direction:column;gap:20px;min-width:0}
.col6{grid-column:span 6;display:flex;flex-direction:column;gap:22px;min-width:0}
.col5{grid-column:span 5;display:flex;flex-direction:column;gap:16px;min-width:0}
h1{margin:0;font-size:40px;font-weight:900;line-height:1.1}
.lead{font-size:18px;font-weight:800;color:var(--muted)}
.sub{margin:0;font-size:20px;font-weight:700;color:var(--muted);line-height:1.4}
.ask{display:flex;gap:12px;align-items:stretch}
.ask input{flex:1;font:inherit;font-size:24px;font-weight:600;padding:20px 22px;border:3px solid #D9DCE6;border-radius:18px;min-width:0}
.primary{font-size:22px;font-weight:900;color:#fff;background:var(--accent);border:0;border-radius:18px;padding:18px 30px;text-align:center;text-decoration:none}
.primary.wide{flex:1}
.ghost{font-size:22px;font-weight:900;padding:18px 26px;border-radius:18px;border:3px solid var(--ink);background:#fff}
.list{display:flex;flex-direction:column;gap:12px}
.try{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;font-size:21px;font-weight:800;padding:18px 22px;border-radius:16px;border:2px solid var(--line);background:var(--card)}
.panel{background:var(--panel);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:16px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.big{font-size:24px;font-weight:900}
.small{font-size:17px;font-weight:600;color:var(--muted)}
.link{background:none;border:0;padding:0;font-size:17px;font-weight:800;color:var(--accent);text-align:left}
.rescue{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:900;padding:20px 22px;border-radius:18px;border:3px solid var(--ink);background:#fff;text-align:left}
.rescue.teal{border-color:var(--teal);color:var(--teal-dark)}
.rescue:disabled{opacity:.45;cursor:default}
.note{margin-top:auto;font-size:15px;font-weight:600;color:var(--faint)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;flex:1}
.boxcard{display:flex;flex-direction:column;align-items:stretch;gap:16px;text-align:left;padding:22px;border-radius:24px;border:3px solid var(--line);background:#fff}
.boxcard.sel{border-color:var(--teal);background:#F0FAFA}
.photo{min-height:230px;border-radius:16px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:17px;font-weight:800;overflow:hidden}
.photo img{width:100%;height:230px;object-fit:cover;display:block}
.boxname{display:flex;align-items:center;justify-content:space-between;font-size:26px;font-weight:900}
.tick{width:34px;height:34px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:32px;text-align:center}
.quote{font-size:34px;font-weight:900;max-width:820px;line-height:1.2}
.stages{list-style:none;margin:12px 0 0;padding:0;display:flex;align-items:flex-start;justify-content:center;flex-wrap:wrap;gap:0}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;width:200px;font-size:19px;font-weight:800;color:var(--faint)}
.stage .ball{width:64px;height:64px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center}
.stage.done{color:var(--teal-dark)}.stage.done .ball{background:var(--teal)}
.stage.now{color:var(--ink);font-weight:900}.stage.now .ball{background:var(--accent);box-shadow:0 0 0 10px var(--accent-soft);animation:pulse 1.2s ease-in-out infinite}
.bar{width:70px;height:6px;background:var(--line);border-radius:3px;margin-top:29px}
.bar.done{background:var(--teal)}
@keyframes pulse{50%{box-shadow:0 0 0 16px var(--accent-soft)}}
.explain{background:var(--panel);border-radius:18px;padding:18px 26px;font-size:19px;font-weight:700;color:var(--muted);max-width:760px}
.explain.warm{background:var(--peach);color:var(--ink);line-height:1.45}
.faint{font-size:16px;font-weight:700;color:var(--faint)}
.donehead{display:flex;align-items:center;gap:16px}
.donehead .tick{width:60px;height:60px}
.donehead h1{font-size:38px}
.prompt{display:flex;align-items:center;gap:14px;text-align:left;font-size:19px;font-weight:800;padding:16px 20px;border-radius:16px;border:2px solid var(--line);background:var(--card)}
.q{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;font-weight:900}
.actions{margin-top:auto;display:flex;gap:12px;flex-wrap:wrap}
pre{margin:0;flex:1;overflow:auto;background:var(--code);color:var(--code-ink);border-radius:18px;padding:20px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.55;min-height:120px;max-height:60vh}
pre .hl{background:#3A3F63;border-radius:4px;padding:0 4px}
pre .set{background:var(--accent);color:#fff;border-radius:6px;padding:1px 8px;font-weight:700}
pre .cm{color:#8A90A8}
.pill{font-size:16px;font-weight:800;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#fff}
.codefoot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;font-weight:700;color:var(--faint);flex-wrap:wrap}
.codefoot button{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--muted);text-decoration:underline}
.codefoot .try-it{color:var(--accent)}
.banner{margin:20px 32px 0;background:var(--amber-bg);border:2px solid var(--amber-line);border-radius:18px;padding:16px 22px;display:flex;align-items:center;gap:16px;font-size:18px;font-weight:700;color:#5B4A1E;line-height:1.35}
.tricks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.trick{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px 20px;border-radius:16px;border:2px solid var(--line);background:var(--card)}
.trick b{font-size:21px;font-weight:900}
.trick span{font-size:16px;font-weight:700;color:var(--muted)}
.trick.numbers{border:2px dashed var(--accent);background:var(--peach)}
.trick.numbers b{color:var(--accent-dark)}
.slider{display:flex;flex-direction:column;gap:10px}
.slider label{display:flex;justify-content:space-between;font-size:22px;font-weight:900}
.slider label output{color:var(--accent)}
.slider input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
.slider select{font:inherit;font-size:20px;font-weight:800;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:#fff}
.summary{background:var(--panel);border-radius:16px;padding:14px 18px;font-size:16px;font-weight:700;color:var(--muted);line-height:1.4}
.back{width:44px;height:44px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;border:0;flex-shrink:0}
textarea.editor{flex:1;min-height:360px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5;padding:16px;border-radius:18px;border:3px solid #D9DCE6;resize:vertical}
footer{padding:16px 32px 24px;display:flex;justify-content:center}
.sr{position:absolute;left:-9999px}
@media (max-width:860px){
  header,main{padding-left:16px;padding-right:16px}
  main{grid-template-columns:1fr;gap:20px;padding-top:20px}
  .col7,.col6,.col5{grid-column:auto}
  h1{font-size:30px}
  .brand{font-size:22px}
  .ask{flex-direction:column}
  .grid3{grid-template-columns:1fr}
  .photo,.photo img{min-height:160px;height:160px}
  .tricks{grid-template-columns:1fr}
  .stage{width:46%}
  .bar{display:none}
  .banner{margin:16px 16px 0}
  .quote{font-size:26px}
  pre{max-height:40vh}
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
'use strict';
// One screen router keyed on state. All kid-facing copy either comes from the
// server (message_kid, titles, prompts) or is copied verbatim from docs/screens.
const S = { status: null, boxes: [], behaviours: [], sketch: null, job: null, asked: '', screen: 'picker',
            picked: null, tweak: null, concept: null, showCode: true, editor: '' };
const $app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (path, body) => {
  const r = await fetch('/api' + path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw Object.assign(new Error('api ' + r.status), { status: r.status });
  return r.json();
};
const boxName = () => (S.boxes.find((b) => b.id === S.status?.box) || {}).name || 'box';
const changes = () => Math.max(0, (S.status?.versions_count || 1) - 1);
const tweakable = () => S.behaviours.find((b) => b.tweakables && b.tweakables.length);

// ---------- icons (inline, no external assets) ----------
const I = {
  logo: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',
  tick: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>`,
  arrow: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6B1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  undo: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-2"/></svg>',
  reset: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
  bolt: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l-6 9h5l-1 7 6-9h-5z"/></svg>',
  wifi: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a8 8 0 0 1 14 0"/><path d="M8.5 15.5a4 4 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/><path d="M3 3l18 18"/></svg>',
  back: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B1F3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
};

// ---------- pieces ----------
function header(opts = {}) {
  const st = S.status || {};
  const plugged = st.board_connected ? 'plugged in' : 'not plugged in';
  const boxChip = st.box ? `<button class="chip ${st.board_connected ? '' : 'off'}" data-act="picker"><span class="dot"></span>${esc(boxName())} · ${plugged}</button>` : '';
  const aiChip = opts.ai === false ? '' : st.ai_available ? '<span class="chip ai">AI helper is here</span>' : '<span class="chip away">AI helper is away</span>';
  const left = opts.back
    ? `<button class="back" data-act="${opts.back}" aria-label="Back">${I.back}</button><div style="font-size:26px;font-weight:900">${opts.title}</div>`
    : `<div class="logo">${I.logo}</div><div>Hack Lab</div>`;
  return `<header><div class="brand">${left}</div><div class="chips">${boxChip}${opts.chips === false ? '' : aiChip}</div></header>`;
}
function rightNow() {
  const st = S.status || {};
  const n = changes();
  return `<div class="panel"><div class="eyebrow">Right now the ${esc(boxName())}</div>
    <div class="big">${n ? `Change ${n}` : 'How it came'}</div>
    <div class="small">${n ? `${n} change${n === 1 ? '' : 's'} since it came` : 'Nothing changed yet'} · version ${esc(st.current_version)}</div>
    <button class="link" data-act="code">Show me the code</button></div>`;
}
function rescue(note) {
  const canUndo = changes() > 0;
  return `<div class="list">
    <button class="rescue" data-act="undo" ${canUndo ? '' : 'disabled'}>${I.undo}Undo last change</button>
    <button class="rescue teal" data-act="reset">${I.reset}Back to how it came</button></div>
    <div class="note">${note}</div>`;
}
function tries() {
  return S.behaviours.slice(0, 3).map((b) => `<button class="try" data-act="behaviour" data-id="${esc(b.id)}"><span>${esc(b.title)}</span>${I.arrow}</button>`).join('');
}
function highlight(src, values) {
  // Numbers carrying a ///{...} Level 2 marker get the highlight; values the
  // kid set in Tweak are shown in the accent colour.
  const lines = src.split('\n').map((line) => {
    let out = esc(line);
    if (/\/\/\/\{/.test(line)) {
      const code = line.split('///')[0];
      const m = code.match(/(\w+)\s*=\s*(-?[\d.]+)|\((\d+)\)/);
      if (m) {
        const name = m[1], val = m[2] ?? m[3];
        const set = values && name && values[name] !== undefined ? values[name] : null;
        out = out.replace(esc(val), set !== null ? `<span class="set">${esc(set)}</span>` : `<span class="hl">${esc(val)}</span>`);
      }
      out = out.replace(/\/\/\/.*$/, (s) => `<span class="cm">${s}</span>`);
    }
    return out;
  });
  return lines.join('\n');
}

// ---------- screens ----------
function picker() {
  const cards = S.boxes.map((b) => {
    const sel = b.id === S.picked;
    return `<button class="boxcard ${sel ? 'sel' : ''}" data-act="pick" data-id="${esc(b.id)}" aria-pressed="${sel}">
      <div class="photo"><img alt="" src="${esc(b.picture)}" onerror="this.onerror=null;this.src='/static/boxes/${esc(b.id)}.svg'"></div>
      <div class="boxname"><span>${esc(b.name)}</span>${sel ? `<span class="tick">${I.tick(20)}</span>` : ''}</div></button>`;
  }).join('');
  return `${header({ chips: false })}<main style="display:flex;flex-direction:column;gap:28px;padding:36px 48px">
    <div><h1>Which box is plugged in?</h1><p class="sub" style="margin-top:8px">Plug the USB cable into the box you want to play with, then tap it here.</p></div>
    <div class="grid3">${cards}</div>
    <div class="row"><div class="faint">Picked the wrong one? No problem, nothing breaks. Just come back here.</div>
    <button class="primary" data-act="go" ${S.picked ? '' : 'disabled'}>Let's go</button></div></main>`;
}
function home() {
  const name = esc(boxName());
  return `${header()}<main>
    <section class="col7"><h1>What should the ${name} do?</h1>
      <label class="lead" for="ask">Say it or type it. Tap the mic on your keyboard to talk.</label>
      <form class="ask" data-form="ask"><input id="ask" type="text" placeholder="Make it shake its head when I press 7" autocomplete="off" enterkeyhint="go"><button class="primary" type="submit">Go!</button></form>
      <div class="lead" style="margin-top:8px">Try one of these</div><div class="list">${tries()}</div></section>
    <aside class="col5">${rightNow()}${rescue('Nothing you try can break it. Those two buttons always put it right.')}</aside></main>`;
}
function offline() {
  const name = esc(boxName());
  const tricks = S.behaviours.map((b) => `<button class="trick" data-act="behaviour" data-id="${esc(b.id)}"><b>${esc(b.title)}</b><span>${esc(b.description)}</span></button>`).join('');
  const numbers = tweakable() ? `<button class="trick numbers" data-act="tweak" data-id="${esc(tweakable().id)}"><b>Change the numbers</b><span>Make a trick faster, bigger, longer</span></button>` : '';
  return `${header()}<div class="banner">${I.wifi}<div><strong style="color:var(--ink)">The AI helper can't hear you right now</strong> — the internet is probably off. You can still pick a trick below or change the numbers in one, and the ${name} will do it. Nothing here needs the internet.</div></div>
    <main style="padding-top:24px"><section class="col7" style="gap:14px"><h1 style="font-size:32px">Pick a trick</h1><div class="tricks">${tricks}${numbers}</div></section>
    <aside class="col5">${rightNow()}${rescue('When the internet is back, the AI helper comes back by itself.')}</aside></main>`;
}
const STAGE_ORDER = ['thinking', 'compiling', 'uploading', 'verifying'];
function working() {
  const job = S.job || {};
  const name = esc(boxName());
  const labels = { thinking: 'Thinking', compiling: 'Building the code', uploading: `Sending to ${name}`, verifying: 'Watch it!' };
  const stages = job.kind === 'ask' ? STAGE_ORDER : STAGE_ORDER.slice(1);
  const idx = stages.indexOf(job.state);
  const at = idx >= 0 ? idx : job.state === 'queued' ? -1 : stages.length;
  const items = stages.map((s, i) => {
    const cls = i < at ? 'done' : i === at ? 'now' : '';
    const ball = i < at ? I.tick(30) : i === at ? I.bolt : '';
    return `${i ? `<li aria-hidden="true" class="bar ${i <= at ? 'done' : ''}"></li>` : ''}<li class="stage ${cls}"><div class="ball">${ball}</div><div>${labels[s]}</div></li>`;
  }).join('');
  return `${header({ chips: false })}<main class="center">
    <div class="lead" style="font-size:20px">You asked</div><div class="quote">“${esc(S.asked)}”</div>
    <ol class="stages">${items}</ol>
    <div class="explain">${esc(job.message_kid || '')}</div>
    <div class="faint">Usually takes about half a minute</div></main>`;
}
function failed() {
  return `${header({ chips: false })}<main class="center">
    <div class="quote" style="color:var(--muted)">“${esc(S.asked)}”</div>
    <div class="explain warm" style="font-size:24px">${esc(S.job.message_kid)}</div>
    <button class="primary" data-act="home">Try again</button></main>`;
}
function done() {
  const job = S.job;
  const name = esc(boxName());
  const n = changes();
  const prompts = (job?.prompts || []).map((p) => `<button class="prompt" data-act="concept" data-id="${esc(p.id)}"><span class="q">?</span><span>${esc(p.question)}</span></button>`).join('');
  const concept = S.concept ? `<div class="explain warm"><strong>${esc(S.concept.title)}.</strong> ${esc(S.concept.explanation)}</div>` : '';
  const head = job ? `<div class="donehead"><span class="tick">${I.tick(32)}</span><h1>${esc(job.message_kid)}</h1></div>
      <p class="sub">${n ? `That was change ${n} since it came.` : 'It is back to how it came.'}</p>` : `<h1>The code right now</h1><p class="sub">Version ${esc(S.status?.current_version)}.</p>`;
  const twk = tweakable();
  return `${header({ chips: false })}<main>
    <section class="col7" style="gap:18px">${head}
      ${prompts ? `<div class="lead" style="margin-top:6px">Curious?</div><div class="list" style="gap:10px">${prompts}</div>` : ''}${concept}
      <div class="actions"><button class="primary wide" data-act="home">Try something else</button><button class="ghost" data-act="undo" ${n ? '' : 'disabled'}>Undo</button></div></section>
    <aside class="col5" style="gap:12px">
      <div class="row"><div class="lead">The code that does it</div><button class="pill" data-act="togglecode">${S.showCode ? 'Hide code' : 'Show code'}</button></div>
      ${S.showCode ? `<pre>${highlight(S.sketch?.source || '')}</pre>` : ''}
      <div class="codefoot"><span>The highlighted numbers are the ones you can change yourself. ${twk ? `<button class="try-it" data-act="tweak" data-id="${esc(twk.id)}">Try it</button>` : ''}</span>
      <button data-act="editor">Level 3: edit all the code</button></div></aside></main>`;
}
function tweak() {
  const t = S.tweak;
  const name = esc(boxName());
  const controls = t.behaviour.tweakables.map((tw) => {
    const id = 'tw-' + tw.name, v = t.values[tw.name];
    if (tw.options) {
      const opts = tw.options.map((o) => `<option value="${esc(o)}" ${String(o) === String(v) ? 'selected' : ''}>${esc(o)}</option>`).join('');
      return `<div class="slider"><label for="${id}"><span>${esc(tw.name)}</span><output data-testid="val-${esc(tw.name)}">${esc(v)}</output></label><select id="${id}" data-tw="${esc(tw.name)}">${opts}</select></div>`;
    }
    const [min, max] = tw.range || [tw.min, tw.max];
    return `<div class="slider"><label for="${id}"><span>${esc(tw.name)}</span><output data-testid="val-${esc(tw.name)}">${esc(v)}</output></label>
      <input id="${id}" type="range" min="${esc(min)}" max="${esc(max)}" step="${esc(tw.step || 1)}" value="${esc(v)}" data-tw="${esc(tw.name)}"></div>`;
  }).join('');
  const src = S.sketch?.source || '';
  const missing = t.behaviour.tweakables.filter((tw) => !new RegExp(`\\b${tw.name}\\b`).test(src));
  const setLine = missing.length ? `<span class="cm">// your numbers: ${missing.map((tw) => `${esc(tw.name)} = `).join('').slice(0, 0)}${missing.map((tw) => `${esc(tw.name)} = <span class="set">${esc(t.values[tw.name])}</span>`).join(', ')}</span>\n` : '';
  return `${header({ back: 'home', title: `${esc(t.behaviour.title)} · Level 2: change the numbers`, chips: false })}<main>
    <section class="col6"><p class="sub">Slide these and watch the code change on the right. The ${name} can't be hurt — every number has a safe limit.</p>
      ${controls}
      <div class="actions"><button class="primary wide" data-act="send">Send to ${name}</button><button class="ghost" data-act="resetnumbers">Reset numbers</button></div></section>
    <aside class="col6" style="gap:12px"><div class="lead">The code, live</div><pre>${setLine}${highlight(src, t.values)}</pre>
      <div class="summary"><strong style="color:var(--ink)">What it will do:</strong> ${esc(t.behaviour.description)}</div></aside></main>`;
}
function editor() {
  const name = esc(boxName());
  return `${header({ back: 'done', title: 'Level 3: edit all the code', chips: false })}<main style="display:flex;flex-direction:column;gap:16px">
    <p class="sub">Change anything you like, then send it. If it does not build, you get it back to fix. Undo always works.</p>
    <textarea class="editor" id="editor" spellcheck="false">${esc(S.editor)}</textarea>
    <div class="actions"><button class="primary wide" data-act="sendsketch">Send to ${name}</button><button class="ghost" data-act="done">Back</button></div></main>`;
}

// ---------- state + actions ----------
const SCREENS = { picker, home, offline, working, failed, done, tweak, editor };
function render() {
  $app.innerHTML = SCREENS[S.screen]();
  const a = document.getElementById('ask');
  if (a && S.screen === 'home' && window.innerWidth > 860) a.focus();
}
function homeScreen() { return S.status?.ai_available ? 'home' : 'offline'; }
async function refresh() {
  S.status = await api('/status');
  if (!S.boxes.length) S.boxes = await api('/boxes').catch(() => []);
  if (S.status.box) {
    [S.behaviours, S.sketch] = await Promise.all([api('/behaviours').catch(() => []), api('/sketch/current').catch(() => null)]);
  }
}
async function startJob(kind, path, body, asked) {
  S.asked = asked;
  S.concept = null;
  try {
    const { job_id } = await api(path, body);
    S.job = { job_id, kind, state: 'queued', message_kid: 'Getting ready.' };
    S.screen = 'working';
    render();
    // The first stage events can beat this response on the SSE stream; sync once.
    api('/jobs/' + job_id).then(onJob).catch(() => {});
    pollJob(job_id);
  } catch (e) {
    if (e.status === 409) { await refresh(); S.screen = S.status.box ? homeScreen() : 'picker'; render(); }
    else { S.job = { kind, state: 'failed', message_kid: 'That one did not work. Try again, or press Undo.' }; S.screen = 'failed'; render(); }
  }
}
function onJob(job) {
  if (!S.job || job.job_id !== S.job.job_id) return;
  S.job = { ...S.job, ...job };
  if (job.state === 'done' || job.state === 'failed') finishJob();
  else if (S.screen === 'working') render();
}
let finishing = false;
async function finishJob() {
  if (finishing) return;
  finishing = true;
  try {
    await refresh();
    if (S.job.state === 'failed') S.screen = 'failed';
    else S.screen = S.job.kind === 'undo' || S.job.kind === 'reset' ? homeScreen() : 'done';
    render();
  } finally { finishing = false; }
}
function pollJob(id) {
  // SSE is primary; this poll is the fallback for a dropped stream.
  const t = setInterval(async () => {
    if (!S.job || S.job.job_id !== id || S.screen !== 'working') return clearInterval(t);
    try { onJob(await api('/jobs/' + id)); } catch (_) { /* keep waiting */ }
  }, 1500);
}
function connectEvents() {
  const es = new EventSource('/api/events');
  es.onmessage = (ev) => { try { onJob(JSON.parse(ev.data)); } catch (_) { /* ping */ } };
  es.onerror = () => { es.close(); setTimeout(connectEvents, 3000); };
}
function openTweak(id) {
  const b = S.behaviours.find((x) => x.id === id);
  if (!b) return;
  S.tweak = { behaviour: b, values: Object.fromEntries(b.tweakables.map((tw) => [tw.name, tw.value])) };
  S.screen = 'tweak';
  render();
}
const ACTIONS = {
  picker: () => { S.picked = S.status?.box || S.picked; S.screen = 'picker'; render(); },
  pick: (id) => { S.picked = id; render(); },
  go: async () => { await api('/box', { id: S.picked }); await refresh(); S.screen = homeScreen(); render(); },
  home: () => { S.screen = homeScreen(); render(); },
  done: () => { S.screen = 'done'; render(); },
  code: () => { S.job = null; S.concept = null; S.screen = 'done'; render(); },
  togglecode: () => { S.showCode = !S.showCode; render(); },
  behaviour: (id) => { const b = S.behaviours.find((x) => x.id === id); startJob('flash', '/flash/behaviour', { id }, b ? b.title : id); },
  undo: () => startJob('undo', '/undo', {}, 'Undo last change'),
  reset: () => startJob('reset', '/reset', {}, 'Back to how it came'),
  tweak: (id) => openTweak(id),
  resetnumbers: () => openTweak(S.tweak.behaviour.id),
  send: () => startJob('flash', '/flash/behaviour', { id: S.tweak.behaviour.id, tweakables: S.tweak.values }, `${S.tweak.behaviour.title}, with my numbers`),
  editor: () => { S.editor = S.sketch?.source || ''; S.screen = 'editor'; render(); },
  sendsketch: () => startJob('flash', '/flash/sketch', { source: document.getElementById('editor').value }, 'My own code'),
  concept: async (id) => { S.concept = await api('/concepts/' + id).catch(() => null); render(); },
};
$app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled) ACTIONS[el.dataset.act](el.dataset.id);
});
$app.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = document.getElementById('ask').value.trim();
  if (text) startJob('ask', '/ask', { text }, text);
});
$app.addEventListener('input', (e) => {
  const name = e.target.dataset.tw;
  if (!name || !S.tweak) return;
  const tw = S.tweak.behaviour.tweakables.find((x) => x.name === name);
  let v = e.target.value;
  if (!tw.options) { const [min, max] = tw.range || [tw.min, tw.max]; v = Math.min(max, Math.max(min, Number(v))); }
  S.tweak.values[name] = v;
  render();
});

(async function boot() {
  try { await refresh(); } catch (_) { S.status = { box: null, ai_available: false, board_connected: false }; }
  S.picked = S.status.box;
  S.screen = S.status.box ? homeScreen() : 'picker';
  render();
  connectEvents();
  setInterval(async () => { if (S.screen === 'home' || S.screen === 'offline') { const was = S.status?.ai_available; await refresh().catch(() => {}); if (S.status?.ai_available !== was) S.screen = homeScreen(); render(); } }, 20000);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('/static/sw.js').catch(() => {});
})();
</script>
</body>
</html>
