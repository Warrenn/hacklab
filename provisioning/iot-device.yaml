AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  hacklab: one IoT Core thing per Pi. The device certificate is issued from a
  CSR generated on the maintainer's machine, so the private key never exists
  in AWS. The policy is scoped to this thing's own client id and topics.

Parameters:
  DeviceName:
    Type: String
    AllowedPattern: "[a-z0-9-]{1,32}"
    Description: Short device id, e.g. pi3. Thing name becomes hacklab-<DeviceName>.
  CertificateSigningRequest:
    Type: String
    NoEcho: true
    Description: PEM CSR generated by scripts/provision-device.sh.

Resources:
  Thing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Sub hacklab-${DeviceName}

  Certificate:
    Type: AWS::IoT::Certificate
    Properties:
      CertificateSigningRequest: !Ref CertificateSigningRequest
      Status: ACTIVE

  Policy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub hacklab-${DeviceName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/hacklab-${DeviceName}
          - Effect: Allow
            Action:
              - iot:Publish
              - iot:Receive
            Resource:
              - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/hacklab-${DeviceName}/shadow/*
              - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/hacklab/${DeviceName}/*
          - Effect: Allow
            Action: iot:Subscribe
            Resource:
              - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/hacklab-${DeviceName}/shadow/*
              - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/hacklab/${DeviceName}/*
          # Jobs (P5c): signed updates. Nothing in a job document is executed; see ops/agent.py allowlist.
          - Effect: Allow
            Action:
              - iot:Publish
              - iot:Receive
            Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/hacklab-${DeviceName}/jobs/*
          - Effect: Allow
            Action: iot:Subscribe
            Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/hacklab-${DeviceName}/jobs/*
          # Credentials provider (P5c option B): the device trades its certificate for role credentials.
          - Effect: Allow
            Action: iot:AssumeRoleWithCertificate
            Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rolealias/hacklab-device

  PolicyAttachment:
    Type: AWS::IoT::PolicyPrincipalAttachment
    Properties:
      PolicyName: !Ref Policy
      Principal: !GetAtt Certificate.Arn

  ThingAttachment:
    Type: AWS::IoT::ThingPrincipalAttachment
    Properties:
      ThingName: !Ref Thing
      Principal: !GetAtt Certificate.Arn

Outputs:
  ThingName:
    Value: !Ref Thing
  CertificateId:
    Value: !Ref Certificate
  CertificateArn:
    Value: !GetAtt Certificate.Arn
