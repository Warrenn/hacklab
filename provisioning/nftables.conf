#!/usr/sbin/nft -f
# Hack Lab input firewall (P7b). Installed to /etc/nftables.conf by provisioning/install.sh.
# Only this table is touched (no `flush ruleset`): Tailscale manages its own tables.
# Inbound: SSH (keys only) and the app / setup portal from anywhere, mDNS so
# hacklab.local resolves, Tailscale, DHCP client replies, and, on wlan0 only,
# the setup hotspot's DNS + DHCP (comitup's dnsmasq). Nothing is forwarded.
table inet hacklab {}
flush table inet hacklab
table inet hacklab {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto { icmp, ipv6-icmp, igmp } accept
    iifname "tailscale0" accept
    udp dport 41641 accept comment "tailscale wireguard"
    tcp dport { 22, 80 } accept comment "ssh (keys only), app / setup portal"
    udp dport 5353 accept comment "mDNS: hacklab.local"
    udp dport 68 accept comment "DHCP client replies"
    udp dport 546 accept comment "DHCPv6 client"
    iifname "wlan0" udp dport { 53, 67 } accept comment "setup hotspot: dnsmasq DNS + DHCP"
    iifname "wlan0" tcp dport 53 accept comment "setup hotspot: DNS over TCP"
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
}
