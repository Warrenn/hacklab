# Box profile: Laser Synthesizer (CrunchLabs Hack Pack). Imported by
# scripts/import-box.sh from the Hack Pack IDE (synthesizer); hand-edited after.
id = "synthesizer"
name = "Laser Synthesizer"
picture = "/static/boxes/laser-synth.svg"
libraries = ["Mozzi@2.0.4"]

[board]
fqbn = "arduino:avr:nano"   # the flasher appends cpu=atmega328 / atmega328old itself
core = "arduino:avr"

[stock]
location = "repo"           # MIT-licensed stock code lives in stock/StockCode/ (headers kept)
main = "StockCode"

# Kid-facing names for the sliders (the IDE markers keep their code names in the code).
[labels]
USE_SERIAL = "Print to the serial monitor"
TOUCHPAD_X_MIN = "Touchpad left edge"
TOUCHPAD_X_MAX = "Touchpad right edge"
TOUCHPAD_Y_MIN = "Touchpad top edge"
TOUCHPAD_Y_MAX = "Touchpad bottom edge"
TOUCHPAD_EDGE_DETECT = "Finger-off point"
MIDI_ROOT_MIN = "Lowest root note"
MIDI_ROOT_MAX = "Highest root note"
DEFAULT_SCALE_TYPE = "Starting scale (0 major, 1 minor)"
DEFAULT_ROOT_NOTE = "Starting root note"
SMOOTH_FREQ_NORMAL = "Pitch smoothing"
SMOOTH_GAIN_FAST = "Volume smoothing"
SMOOTH_GAIN_SLOW = "Volume fade-out"
WAVE_COUNT = "How many wave shapes"
DEFAULT_WAVE = "Starting wave shape"
MASTER_GAIN_MAX = "Loudest volume"
VOLUME_SHIFT_AMOUNT = "Volume step (higher is quieter)"
PROX_GAIN_REDUCTION = "Hand-near volume drop"
LFO_MIN_BPM = "Slowest wobble"
LFO_MAX_BPM = "Fastest wobble"
LFO_SPINNER_NODES = "Spinner arms"
LFO_MIN_NODE_WIDTH = "Spinner arm width"
LFO_DECAY_TIMEOUT = "Wobble settle delay"
LFO_BPM_MULTIPLIER = "Spin-to-wobble ratio"
LFO_DECAY_RATE = "Wobble settle speed"
AUDIO_OUTPUT_BITS = "Sound detail"
SCALE_OCTAVES = "Octaves on the pad"
NOTE_OFFSET_MIN = "Lowest pad note offset"
SERIAL_OUTPUT_DIVIDER = "Serial print rate"

[genie]
skeleton = "genie/skeleton.ino"   # stock sketch with //@@ markers; config.h & co. ride along
# Helper functions and variables the AI helper may use (all defined in the skeleton):
helpers = [
  "readInputs(): already called every control tick; fills waveSet (0-3), noteSet1, noteSet2, gainSet (0-1023), volumeSet2",
  "generateScale(scaleIndex, rootNote): rebuild the note table; scaleIndex 0-11 (0 Major, 1 Minor, ...), rootNote is a MIDI note 24-108",
  "setFrequencies(): push noteSet1 / noteSet2 to the two oscillators after changing them",
  "proxTriggered: true while a hand is over the proximity sensor; getLFOModulation(): 0.0-1.0 wobble from the spinner",
  "Never put delay() or slow code in loop(): Mozzi makes the sound there and it will crackle",
]
keys = []

[copy]
ask_placeholder = "Make it play a minor scale instead of a major one"
[[copy.suggestions]]
title = "Play a minor scale"
ask = "Change the default scale to Minor so it sounds a bit spooky"
[[copy.suggestions]]
title = "Start one octave higher"
ask = "Make the default root note one octave higher"
[[copy.suggestions]]
title = "Square wave by default"
ask = "Start up on the Square wave instead of Triangle"
