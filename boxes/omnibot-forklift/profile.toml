# Box profile: Omnibot Forklift (CrunchLabs Hack Pack). Nano-class per its stock
# sketch (pins 14-19 used as digital = A0-A5). The stock code carries no license
# header, so it is NOT in the repo: the maintainer copies it onto the device.
id = "omnibot-forklift"
name = "Omnibot Forklift"
picture = "/static/boxes/omnibot-forklift.svg"
libraries = []

[board]
fqbn = "arduino:avr:nano"
core = "arduino:avr"

[stock]
location = "device"         # data/boxes/omnibot-forklift/stock/StockCode/StockCode.ino (+ config.h)
main = "StockCode"

[copy]
ask_placeholder = "Lift the fork up and down every five seconds"
[[copy.suggestions]]
title = "Lift the fork every five seconds"
ask = "lift the fork up for one second then put it down, every five seconds"
[[copy.suggestions]]
title = "Say hello on the serial monitor"
ask = "print the word hello on the serial monitor every two seconds"
[[copy.suggestions]]
title = "Drive slower"
ask = "make the wheels go at half speed"

[genie]
skeleton = "genie/skeleton.ino"   # on the device: data/boxes/omnibot-forklift/genie/skeleton.ino (stock-derived, not in git)
notes = "This box has no remote-key switch: put every rule in the loop fragment (it runs after the stock drive code each loop, use millis() for timing) and leave cases empty. Keep it short: one or two rules."
helpers = [
  "moveFork = 1 raises the fork, -1 lowers it, 0 stops it; call driveLift() after setting it",
  "driveLift(): applies moveFork to the lift motor",
  "driveWheels(speeds, maxSpeed): drive the three wheels from a float[3] of -1..1 speeds",
  "Serial.println(...): prints to the serial monitor at 115200",
]
keys = []
